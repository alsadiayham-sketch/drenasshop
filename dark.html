<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enas Shop | Dark Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #111; color: #eee; }

        .nav {
            position: fixed; top: 0; width: 100%; background: rgba(17,17,17,0.9);
            backdrop-filter: blur(20px); z-index: 100; padding: 18px 40px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .nav-logo { font-size: 1.4rem; font-weight: 700; color: #fff; }
        .nav-links a { margin: 0 15px; color: #777; text-decoration: none; font-size: 0.9rem; }
        .nav-links a:hover { color: #fff; }

        .hero {
            min-height: 90vh; display: flex; align-items: center; justify-content: center;
            padding: 40px; text-align: center;
            background: linear-gradient(180deg, rgba(17,17,17,0.92) 0%, rgba(26,26,46,0.92) 50%, rgba(22,33,62,0.92) 100%), url('https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=1600&h=900&fit=crop') center/cover no-repeat;
        }
        .hero h1 {
            font-size: 4.5rem; font-weight: 700; margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero p { font-size: 1.2rem; color: #888; max-width: 550px; margin: 0 auto 35px; line-height: 1.8; }
        .hero-btn {
            display: inline-block; padding: 14px 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border-radius: 8px; text-decoration: none; font-weight: 500;
        }

        .stats-bar {
            display: flex; justify-content: center; gap: 60px; padding: 40px;
            background: #0a0a0a; border-top: 1px solid #222; border-bottom: 1px solid #222;
        }
        .stat { text-align: center; }
        .stat-num { font-size: 2rem; font-weight: 700; color: #667eea; }
        .stat-label { font-size: 0.8rem; color: #666; margin-top: 5px; }

        .products-section { padding: 80px 40px; max-width: 1400px; margin: 0 auto; }
        .section-title { text-align: center; font-size: 2rem; color: #fff; margin-bottom: 50px; }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;
        }
        .product-card {
            background: #1a1a1a; border-radius: 16px; overflow: hidden;
            transition: all 0.3s; border: 1px solid #222;
        }
        .product-card:hover {
            border-color: #667eea; transform: translateY(-5px);
            box-shadow: 0 10px 40px rgba(102,126,234,0.15);
        }
        .product-card img { width: 100%; height: 260px; object-fit: cover; }
        .product-info { padding: 20px; }
        .product-brand { font-size: 0.75rem; color: #667eea; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .product-name { font-size: 1rem; font-weight: 500; margin-bottom: 8px; color: #eee; }
        .product-desc { font-size: 0.85rem; color: #666; line-height: 1.5; margin-bottom: 12px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .product-price { font-size: 1.2rem; font-weight: 700; color: #fff; }
        .product-tag {
            padding: 4px 10px; background: rgba(102,126,234,0.15); color: #667eea;
            border-radius: 6px; font-size: 0.7rem;
        }

        footer { text-align: center; padding: 50px; color: #444; border-top: 1px solid #222; }
        footer a { color: #667eea; text-decoration: none; }

        .loading { text-align: center; padding: 60px; color: #555; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .stats-bar { gap: 30px; flex-wrap: wrap; }
            .products-grid { grid-template-columns: 1fr; }
        }
            .product-card.hidden { display: none; } .filters-section { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 30px 30px 0; max-width: 1300px; margin: 0 auto; } .filter-btn { padding: 8px 18px; border-radius: 8px; border: 1px solid #333; background: transparent; cursor: pointer; font-family: inherit; font-size: 0.8rem; font-weight: 500; transition: all 0.3s; color: #777; } .filter-btn.active { background: #667eea; color: #fff; border-color: #667eea; } .filter-btn:hover { border-color: #667eea; color: #667eea; }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-logo"><img src="logo.png" style="height:36px;border-radius:50%;vertical-align:middle;margin-left:8px">Enas Shop</div>
        <div class="nav-links">
            <a href="#products">Products</a>
            <a href="https://www.instagram.com/dr_enas_shop/" target="_blank">IG</a>
        </div>
    </nav>

    <section class="hero">
        <div>
            <h1>Enas Shop</h1>
            <p>عالم مختلف من العناية بالبشرة — منتجات عالمية بتقنيات متقدمة لنتائج تشوفيها</p>
            <a href="#products" class="hero-btn">تصفح المنتجات</a>
        </div>
    </section>

    <div class="stats-bar">
        <div class="stat"><div class="stat-num" id="statProducts">0</div><div class="stat-label">منتج</div></div>
        <div class="stat"><div class="stat-num">8+</div><div class="stat-label">ماركة</div></div>
        <div class="stat"><div class="stat-num">100%</div><div class="stat-label">أصلي</div></div>
    </div>

        <div class="filters-section" id="filters"></div>`n`n    <section class="products-section" id="products">
        <h2 class="section-title">جميع المنتجات</h2>
        <div class="products-grid" id="productsGrid">
            <div class="loading">loading...</div>
        </div>
    </section>

    <footer>
        <p>Enas Shop | <a href="https://www.instagram.com/dr_enas_shop/">@dr_enas_shop</a></p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        (function() {
            var grid = document.getElementById('productsGrid');
            var filtersEl = document.getElementById('filters');
            var currentFilter = 'all';
            db.collection('products').orderBy('order').get().then(function(snap) {
                if (snap.empty) { grid.innerHTML = '<p class="loading">لا توجد منتجات</p>'; return; }
                var categories = new Set(), brands = new Set(), products = [];
                snap.forEach(function(doc) { var p = doc.data(); products.push(p); if (p.category) categories.add(p.category); if (p.brand) brands.add(p.brand); });
                var fh = '<button class="filter-btn active" data-filter="all">الكل</button>';
                categories.forEach(function(c) { fh += '<button class="filter-btn" data-filter="cat:'+c+'">'+c+'</button>'; });
                brands.forEach(function(b) { fh += '<button class="filter-btn" data-filter="brand:'+b+'">'+b+'</button>'; });
                filtersEl.innerHTML = fh;
                filtersEl.addEventListener('click', function(e) {
                    if (!e.target.classList.contains('filter-btn')) return;
                    filtersEl.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
                    e.target.classList.add('active'); currentFilter = e.target.getAttribute('data-filter');
                    grid.querySelectorAll('.product-card').forEach(function(card) {
                        var show = currentFilter==='all'||(currentFilter==='cat:'+card.dataset.category)||(currentFilter==='brand:'+card.dataset.brand);
                        card.classList.toggle('hidden',!show);
                    });
                });
                var html = '';
                products.forEach(function(p) {
                    var price = p.sizes && p.sizes[0] ? p.sizes[0].price : p.price || 0;
                    html += '<div class="product-card" data-category="'+(p.category||'')+'" data-brand="'+(p.brand||'')+'">' +
                        '<img src="'+(p.image||'')+'" alt="'+p.name+'" onerror="this.style.display=\'none\'">' +
                        '<div class="product-info"><div class="product-brand">'+(p.brand||'')+'</div>' +
                        '<div class="product-name">'+p.name+'</div>' +
                        '<div class="product-desc">'+(p.description||'').substring(0,70)+'</div>' +
                        '<div class="product-price">₪'+price+'</div></div></div>';
                });
                grid.innerHTML = html;
            }).catch(function(e) { grid.innerHTML = '<p class="loading">خطأ في التحميل</p>'; });
        })();
    </script>
</body>
</html>
