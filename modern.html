<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enas Shop | Modern Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: #f0f2f5; color: #1a1a2e; }

        .nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 1200px;
            background: #fff; z-index: 100; padding: 15px 30px;
            display: flex; align-items: center; justify-content: space-between;
            border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        .nav-logo { font-size: 1.2rem; font-weight: 900; color: #1a1a2e; }
        .nav-links a {
            margin: 0 10px; color: #fff; text-decoration: none; font-size: 0.85rem;
            padding: 8px 18px; border-radius: 8px; background: #1a1a2e; font-weight: 500;
        }

        .hero {
            min-height: 85vh; display: flex; align-items: center; padding: 120px 40px 60px;
            max-width: 1200px; margin: 0 auto;
            background: url('https://images.unsplash.com/photo-1556228720-195a672e8a03?w=1600&h=900&fit=crop') center/cover no-repeat;
            border-radius: 0 0 30px 30px; position: relative;
        }
        .hero::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(240,242,245,0.92), rgba(240,242,245,0.85));
            border-radius: 0 0 30px 30px;
        }
        .hero > * { position: relative; z-index: 1; }
        .hero-text { flex: 1; }
        .hero-text h1 { font-size: 3.5rem; font-weight: 900; line-height: 1.2; margin-bottom: 20px; }
        .hero-text h1 span {
            background: linear-gradient(135deg, #00b894, #00cec9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .hero-text p { font-size: 1.1rem; color: #666; line-height: 1.8; margin-bottom: 30px; max-width: 450px; }
        .hero-btn {
            display: inline-flex; align-items: center; gap: 10px; padding: 15px 30px;
            background: #1a1a2e; color: #fff; border-radius: 12px;
            text-decoration: none; font-weight: 600;
        }
        .hero-shapes {
            flex: 1; display: flex; justify-content: center; align-items: center;
            position: relative; height: 400px;
        }
        .shape {
            position: absolute; border-radius: 30px;
        }
        .shape-1 { width: 200px; height: 200px; background: linear-gradient(135deg, #00b894, #00cec9); top: 20%; right: 10%; transform: rotate(15deg); }
        .shape-2 { width: 150px; height: 150px; background: linear-gradient(135deg, #fdcb6e, #f39c12); bottom: 20%; right: 30%; transform: rotate(-10deg); opacity: 0.8; }
        .shape-3 { width: 100px; height: 100px; background: linear-gradient(135deg, #a29bfe, #6c5ce7); top: 40%; left: 10%; transform: rotate(25deg); opacity: 0.7; }

        .products-section { padding: 60px 40px; max-width: 1200px; margin: 0 auto; }
        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .section-header h2 { font-size: 1.8rem; font-weight: 900; }
        .section-header span { color: #888; font-size: 0.9rem; }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px;
        }
        .product-card {
            background: #fff; border-radius: 20px; overflow: hidden;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04); transition: all 0.3s;
        }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .product-card img { width: 100%; height: 240px; object-fit: cover; }
        .product-info { padding: 20px; }
        .product-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .product-brand {
            padding: 4px 10px; background: #f0f2f5; border-radius: 6px;
            font-size: 0.7rem; font-weight: 600; color: #666;
        }
        .product-status {
            width: 8px; height: 8px; border-radius: 50%; background: #00b894;
        }
        .product-name { font-size: 1rem; font-weight: 600; margin-bottom: 12px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .product-price { font-size: 1.2rem; font-weight: 900; color: #1a1a2e; }
        .product-add {
            width: 36px; height: 36px; border-radius: 10px; background: #1a1a2e;
            color: #fff; border: none; font-size: 1.2rem; cursor: pointer;
        }

        footer { text-align: center; padding: 40px; color: #999; }
        footer a { color: #00b894; text-decoration: none; }

        .loading { text-align: center; padding: 60px; color: #999; }

        @media (max-width: 768px) {
            .hero { flex-direction: column; text-align: center; padding-top: 100px; }
            .hero-text h1 { font-size: 2.5rem; }
            .hero-text p { max-width: 100%; }
            .hero-shapes { display: none; }
            .products-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .nav { top: 10px; width: calc(100% - 20px); }
        }
            .product-card.hidden { display: none; } .filters-section { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 30px 30px 0; max-width: 1300px; margin: 0 auto; } .filter-btn { padding: 8px 18px; border-radius: 10px; border: 1px solid #e0e0e0; background: #fff; cursor: pointer; font-family: inherit; font-size: 0.8rem; font-weight: 600; transition: all 0.3s; color: #666; } .filter-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; } .filter-btn:hover { border-color: #1a1a2e; }
    
        /* Dynamic Hero Slider */
        .hero-slider { position: relative; width: 100%; min-height: 70vh; overflow: hidden; }
        .hero-slider .hero-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease; }
        .hero-slider .hero-slide.active { opacity: 1; position: relative; }
        .hero-slider .hero-slide img,
        .hero-slider .hero-slide video { width: 100%; height: 70vh; object-fit: cover; display: block; }
        .hero-slider .hero-slide-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; text-align: center; }
        .hero-slider .hero-slide-text h2 { font-size: 2.5rem; color: #fff; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        .hero-slider .hero-slide-text p { font-size: 1.2rem; color: rgba(255,255,255,0.9); text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .hero-dots-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
        .hero-dots-container button { width: 10px; height: 10px; border-radius: 50%; border: none; background: rgba(255,255,255,0.5); cursor: pointer; transition: all 0.3s; }
        .hero-dots-container button.active { background: #fff; transform: scale(1.3); }

    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-logo"><img src="logo.png" style="height:36px;border-radius:50%;vertical-align:middle;margin-left:8px">Enas Shop</div>
        <div class="nav-links">
            <a href="#products">تسوق</a>
        </div>
    </nav>

    <section class="hero-slider" id="heroSlider">
        <div class="hero-slide active" style="background:linear-gradient(135deg,#1a2a3a,#2C8C99);height:70vh;display:flex;align-items:center;justify-content:center;">
            <div class="hero-slide-overlay"><div class="hero-slide-text"><h2>جاري التحميل...</h2></div></div>
        </div>
    </section>

        <div class="filters-section" id="filters"></div>`n`n    <section class="products-section" id="products">
        <div class="section-header">
            <h2>المنتجات</h2>
            <span id="productsCount"></span>
        </div>
        <div class="products-grid" id="productsGrid">
            <div class="loading">loading...</div>
        </div>
    </section>

    <footer>
        <p>Enas Shop | <a href="https://www.instagram.com/dr_enas_shop/">@dr_enas_shop</a></p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        (function() {
            var grid = document.getElementById('productsGrid');
            var filtersEl = document.getElementById('filters');
            var currentFilter = 'all';
            db.collection('products').orderBy('order').get().then(function(snap) {
                if (snap.empty) { grid.innerHTML = '<p class="loading">لا توجد منتجات</p>'; return; }
                var categories = new Set(), brands = new Set(), products = [];
                snap.forEach(function(doc) { var p = doc.data(); products.push(p); if (p.category) categories.add(p.category); if (p.brand) brands.add(p.brand); });
                var fh = '<button class="filter-btn active" data-filter="all">الكل</button>';
                categories.forEach(function(c) { fh += '<button class="filter-btn" data-filter="cat:'+c+'">'+c+'</button>'; });
                brands.forEach(function(b) { fh += '<button class="filter-btn" data-filter="brand:'+b+'">'+b+'</button>'; });
                filtersEl.innerHTML = fh;
                filtersEl.addEventListener('click', function(e) {
                    if (!e.target.classList.contains('filter-btn')) return;
                    filtersEl.querySelectorAll('.filter-btn').forEach(function(b){b.classList.remove('active');});
                    e.target.classList.add('active'); currentFilter = e.target.getAttribute('data-filter');
                    grid.querySelectorAll('.product-card').forEach(function(card) {
                        var show = currentFilter==='all'||(currentFilter==='cat:'+card.dataset.category)||(currentFilter==='brand:'+card.dataset.brand);
                        card.classList.toggle('hidden',!show);
                    });
                });
                var html = '';
                products.forEach(function(p) {
                    var price = p.sizes && p.sizes[0] ? p.sizes[0].price : p.price || 0;
                    html += '<div class="product-card" data-category="'+(p.category||'')+'" data-brand="'+(p.brand||'')+'">' +
                        '<img src="'+(p.image||'')+'" alt="'+p.name+'" onerror="this.style.display=\'none\'">' +
                        '<div class="product-info"><div class="product-brand">'+(p.brand||'')+'</div>' +
                        '<div class="product-name">'+p.name+'</div>' +
                        '<div class="product-desc">'+(p.description||'').substring(0,70)+'</div>' +
                        '<div class="product-price">₪'+price+'</div></div></div>';
                });
                grid.innerHTML = html;
            }).catch(function(e) { grid.innerHTML = '<p class="loading">خطأ في التحميل</p>'; });
        })();
    
// Dynamic Hero Slider from Firestore
var heroSlideIndex = 0;
var heroContainer = document.getElementById('heroSlider');
if (heroContainer) {
    db.collection('heroDisplay').orderBy('order', 'asc').get().then(function(snap) {
        if (snap.empty) return;
        var slides = [];
        snap.forEach(function(doc) { slides.push(doc.data()); });
        var html = slides.map(function(slide, idx) {
            var media = slide.type === 'video'
                ? '<video src="'+slide.url+'" muted playsinline'+(idx===0?' autoplay':'')+' style="width:100%;height:70vh;object-fit:cover;" onended="goHeroSlide('+ ((idx+1)%slides.length) +')"><\/video>'
                : '<img src="'+slide.url+'" alt="'+(slide.title||'')+'">';
            return '<div class="hero-slide'+(idx===0?' active':'')+'">'+media+
                '<div class="hero-slide-overlay"><div class="hero-slide-text">'+
                (slide.title ? '<h2>'+slide.title+'<\/h2>' : '')+
                (slide.subtitle ? '<p>'+slide.subtitle+'<\/p>' : '')+
                '<\/div><\/div><\/div>';
        }).join('');
        if (slides.length > 1) {
            html += '<div class="hero-dots-container">' + slides.map(function(_, idx) {
                return '<button class="'+(idx===0?'active':'')+'" onclick="goHeroSlide('+idx+')"><\/button>';
            }).join('') + '<\/div>';
        }
        heroContainer.innerHTML = html;
        setInterval(function() {
            var allSlides = heroContainer.querySelectorAll('.hero-slide');
            if (allSlides.length <= 1) return;
            var current = allSlides[heroSlideIndex];
            if (current && !current.querySelector('video')) {
                goHeroSlide((heroSlideIndex + 1) % allSlides.length);
            }
        }, 5000);
    });
}
function goHeroSlide(n) {
    var c = document.getElementById('heroSlider');
    if (!c) return;
    var allSlides = c.querySelectorAll('.hero-slide');
    var allDots = c.querySelectorAll('.hero-dots-container button');
    if (!allSlides.length) return;
    allSlides[heroSlideIndex].classList.remove('active');
    if (allDots[heroSlideIndex]) allDots[heroSlideIndex].classList.remove('active');
    heroSlideIndex = n;
    allSlides[heroSlideIndex].classList.add('active');
    if (allDots[heroSlideIndex]) allDots[heroSlideIndex].classList.add('active');
    var vid = allSlides[heroSlideIndex].querySelector('video');
    if (vid) { vid.currentTime = 0; vid.play(); }
}

</script>
</body>
</html>
