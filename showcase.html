<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enas Shop | Showcase</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --accent: #00d2ff;
            --accent2: #7b2ff7;
            --bg: #050510;
            --card: #0d0d1a;
            --text: #e8eaf6;
            --muted: #6a6a8a;
        }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* CURSOR GLOW */
        .cursor-glow {
            position: fixed; width: 600px; height: 600px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0,210,255,0.06) 0%, transparent 70%);
            pointer-events: none; z-index: 0; transform: translate(-50%, -50%);
            transition: left 0.3s ease, top 0.3s ease;
        }

        /* NAV */
        .nav {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            width: calc(100% - 40px); max-width: 1100px; z-index: 100;
            padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
            background: rgba(13,13,26,0.7); backdrop-filter: blur(20px) saturate(1.5);
            border: 1px solid rgba(0,210,255,0.1); border-radius: 60px;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; }
        .nav-logo img { height: 34px; border-radius: 50%; border: 2px solid rgba(0,210,255,0.3); }
        .nav-links { display: flex; gap: 8px; }
        .nav-links a {
            padding: 8px 18px; border-radius: 30px; text-decoration: none;
            color: var(--muted); font-size: 0.85rem; font-weight: 500; transition: all 0.3s;
        }
        .nav-links a:hover { color: var(--accent); background: rgba(0,210,255,0.08); }

        /* HERO */
        .hero {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
            padding: 120px 30px 80px; position: relative;
        }
        .hero-orb {
            position: absolute; width: 500px; height: 500px; border-radius: 50%;
            filter: blur(80px); opacity: 0.4; animation: orbFloat 8s ease-in-out infinite;
        }
        .hero-orb-1 { background: var(--accent); top: 10%; right: 10%; }
        .hero-orb-2 { background: var(--accent2); bottom: 10%; left: 10%; animation-delay: -4s; }
        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .hero-content { position: relative; z-index: 2; }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 8px 20px; border-radius: 50px; font-size: 0.8rem;
            background: rgba(0,210,255,0.08); border: 1px solid rgba(0,210,255,0.2);
            color: var(--accent); margin-bottom: 30px;
        }
        .hero-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .hero h1 {
            font-size: clamp(2.5rem, 6vw, 5rem); font-weight: 900; line-height: 1.1;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #fff 0%, var(--accent) 50%, var(--accent2) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-size: 200% 200%; animation: gradientShift 5s ease infinite;
        }
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .hero p { font-size: 1.15rem; color: var(--muted); max-width: 500px; margin: 0 auto 40px; line-height: 1.8; }
        .hero-cta {
            display: inline-flex; align-items: center; gap: 10px; padding: 16px 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff; border-radius: 50px; text-decoration: none; font-weight: 700;
            box-shadow: 0 10px 40px rgba(0,210,255,0.3); transition: transform 0.3s, box-shadow 0.3s;
        }
        .hero-cta:hover { transform: translateY(-3px); box-shadow: 0 15px 50px rgba(0,210,255,0.4); }

        /* SCROLL INDICATOR */
        .scroll-indicator {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            width: 24px; height: 40px; border: 2px solid rgba(255,255,255,0.2); border-radius: 12px;
            display: flex; justify-content: center;
        }
        .scroll-indicator::after {
            content: ''; width: 4px; height: 10px; background: var(--accent);
            border-radius: 2px; margin-top: 6px; animation: scrollBounce 2s infinite;
        }
        @keyframes scrollBounce { 0%, 100% { transform: translateY(0); opacity: 1; } 50% { transform: translateY(12px); opacity: 0.3; } }

        /* STATS */
        .stats {
            display: flex; justify-content: center; gap: 60px; padding: 50px 30px;
            border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .stat { text-align: center; }
        .stat-num {
            font-size: 2.5rem; font-weight: 900;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .stat-label { font-size: 0.8rem; color: var(--muted); margin-top: 5px; letter-spacing: 1px; }

        /* FILTERS */
        .filters-section {
            padding: 40px 30px 0; max-width: 1200px; margin: 0 auto;
            display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;
        }
        .filter-btn {
            padding: 10px 22px; border-radius: 50px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.03); color: var(--muted); font-size: 0.85rem;
            cursor: pointer; font-family: inherit; font-weight: 500; transition: all 0.3s;
        }
        .filter-btn:hover { border-color: rgba(0,210,255,0.3); color: var(--accent); }
        .filter-btn.active {
            background: linear-gradient(135deg, rgba(0,210,255,0.15), rgba(123,47,247,0.15));
            border-color: var(--accent); color: #fff;
        }

        /* PRODUCTS */
        .products-section { padding: 50px 30px 100px; max-width: 1300px; margin: 0 auto; }
        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 40px;
        }
        .section-header h2 { font-size: 1.6rem; font-weight: 700; }
        .section-header span { color: var(--muted); font-size: 0.85rem; }

        .products-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 24px;
        }
        .product-card {
            background: var(--card); border: 1px solid rgba(255,255,255,0.05);
            border-radius: 24px; overflow: hidden; transition: all 0.4s;
            position: relative;
        }
        .product-card::before {
            content: ''; position: absolute; inset: 0; border-radius: 24px;
            background: linear-gradient(135deg, rgba(0,210,255,0.1), transparent, rgba(123,47,247,0.1));
            opacity: 0; transition: opacity 0.4s;
        }
        .product-card:hover::before { opacity: 1; }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0,210,255,0.1), 0 0 0 1px rgba(0,210,255,0.2);
        }
        .product-img-wrap { position: relative; overflow: hidden; }
        .product-card img { width: 100%; height: 280px; object-fit: cover; transition: transform 0.5s; }
        .product-card:hover img { transform: scale(1.05); }
        .product-badge-wrap { position: absolute; top: 15px; right: 15px; display: flex; gap: 6px; }
        .product-status-badge {
            padding: 5px 12px; border-radius: 50px; font-size: 0.7rem; font-weight: 600;
            backdrop-filter: blur(10px);
        }
        .badge-bestseller { background: rgba(0,210,255,0.2); color: var(--accent); border: 1px solid rgba(0,210,255,0.3); }
        .badge-new { background: rgba(123,47,247,0.2); color: #b57aff; border: 1px solid rgba(123,47,247,0.3); }

        .product-info { padding: 24px; position: relative; z-index: 1; }
        .product-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .product-brand {
            font-size: 0.7rem; color: var(--accent); text-transform: uppercase;
            letter-spacing: 2px; font-weight: 600;
        }
        .product-category { font-size: 0.7rem; color: var(--muted); }
        .product-name { font-size: 1.05rem; font-weight: 600; margin-bottom: 8px; color: #fff; }
        .product-desc { font-size: 0.8rem; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .product-price { font-size: 1.3rem; font-weight: 900; color: #fff; }
        .product-price span { font-size: 0.8rem; color: var(--muted); font-weight: 400; }
        .product-cart-btn {
            width: 42px; height: 42px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #fff; font-size: 1.3rem; cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
        }
        .product-cart-btn:hover { transform: scale(1.1); box-shadow: 0 5px 20px rgba(0,210,255,0.4); }

        /* FOOTER */
        footer {
            text-align: center; padding: 50px 30px; border-top: 1px solid rgba(255,255,255,0.05);
            color: var(--muted); font-size: 0.85rem;
        }
        footer a { color: var(--accent); text-decoration: none; }

        .loading { text-align: center; padding: 80px; color: var(--muted); grid-column: 1/-1; }

        /* HIDE on filter */
        .product-card.hidden { display: none; }

        @media (max-width: 768px) {
            .hero h1 { font-size: 2.5rem; }
            .stats { gap: 30px; flex-wrap: wrap; }
            .products-grid { grid-template-columns: 1fr; }
            .nav { width: calc(100% - 20px); top: 10px; padding: 10px 18px; }
            .hero-orb { width: 300px; height: 300px; }
        }
    
        /* Dynamic Hero Slider */
        .hero-slider { position: relative; width: 100%; min-height: 70vh; overflow: hidden; }
        .hero-slider .hero-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 0.8s ease; }
        .hero-slider .hero-slide.active { opacity: 1; position: relative; }
        .hero-slider .hero-slide img,
        .hero-slider .hero-slide video { width: 100%; height: 70vh; object-fit: cover; display: block; }
        .hero-slider .hero-slide-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; text-align: center; }
        .hero-slider .hero-slide-text h2 { font-size: 2.5rem; color: #fff; margin-bottom: 10px; text-shadow: 0 2px 8px rgba(0,0,0,0.4); }
        .hero-slider .hero-slide-text p { font-size: 1.2rem; color: rgba(255,255,255,0.9); text-shadow: 0 1px 4px rgba(0,0,0,0.3); }
        .hero-dots-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 8px; z-index: 10; }
        .hero-dots-container button { width: 10px; height: 10px; border-radius: 50%; border: none; background: rgba(255,255,255,0.5); cursor: pointer; transition: all 0.3s; }
        .hero-dots-container button.active { background: #fff; transform: scale(1.3); }

    </style>
</head>
<body>
    <div class="cursor-glow" id="cursorGlow"></div>

    <nav class="nav">
        <div class="nav-logo"><img src="logo.png" alt="Enas">Enas Shop</div>
        <div class="nav-links">
            <a href="#products">المنتجات</a>
            <a href="https://www.instagram.com/dr_enas_shop/" target="_blank">Instagram</a>
            <a href="https://wa.me/970595170026" target="_blank">WhatsApp</a>
        </div>
    </nav>

    <section class="hero-slider" id="heroSlider">
        <div class="hero-slide active" style="background:linear-gradient(135deg,#1a2a3a,#2C8C99);height:70vh;display:flex;align-items:center;justify-content:center;">
            <div class="hero-slide-overlay"><div class="hero-slide-text"><h2>جاري التحميل...</h2></div></div>
        </div>
    </section>

    <div class="stats">
        <div class="stat"><div class="stat-num" id="statProducts">0</div><div class="stat-label">منتج</div></div>
        <div class="stat"><div class="stat-num">8+</div><div class="stat-label">ماركة عالمية</div></div>
        <div class="stat"><div class="stat-num">100%</div><div class="stat-label">أصلي ومضمون</div></div>
    </div>

    <div class="filters-section" id="filters"></div>

    <section class="products-section" id="products">
        <div class="section-header">
            <h2>المنتجات</h2>
            <span id="filteredCount"></span>
        </div>
        <div class="products-grid" id="productsGrid">
            <div class="loading">جاري التحميل...</div>
        </div>
    </section>

    <footer>
        <p>Enas Shop &copy; 2024 | <a href="https://www.instagram.com/dr_enas_shop/">@dr_enas_shop</a> | <a href="https://wa.me/970595170026">WhatsApp</a></p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        // Cursor glow effect
        document.addEventListener('mousemove', function(e) {
            var glow = document.getElementById('cursorGlow');
            glow.style.left = e.clientX + 'px';
            glow.style.top = e.clientY + 'px';
        });

        (function() {
            var grid = document.getElementById('productsGrid');
            var filtersEl = document.getElementById('filters');
            var allProducts = [];
            var currentFilter = 'all';

            db.collection('products').orderBy('order').get().then(function(snap) {
                if (snap.empty) { grid.innerHTML = '<p class="loading">لا توجد منتجات</p>'; return; }

                document.getElementById('statProducts').textContent = snap.size;

                // Collect all products and categories
                var categories = new Set();
                var brands = new Set();
                snap.forEach(function(doc) {
                    var p = doc.data(); p.id = doc.id;
                    allProducts.push(p);
                    if (p.category) categories.add(p.category);
                    if (p.brand) brands.add(p.brand);
                });

                // Build filter buttons
                var filterHtml = '<button class="filter-btn active" data-filter="all">الكل</button>';
                categories.forEach(function(cat) {
                    filterHtml += '<button class="filter-btn" data-filter="cat:' + cat + '">' + cat + '</button>';
                });
                brands.forEach(function(brand) {
                    filterHtml += '<button class="filter-btn" data-filter="brand:' + brand + '">' + brand + '</button>';
                });
                filtersEl.innerHTML = filterHtml;

                // Filter click handler
                filtersEl.addEventListener('click', function(e) {
                    if (!e.target.classList.contains('filter-btn')) return;
                    filtersEl.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
                    e.target.classList.add('active');
                    currentFilter = e.target.getAttribute('data-filter');
                    applyFilter();
                });

                renderProducts(allProducts);
            }).catch(function(e) { grid.innerHTML = '<p class="loading">خطأ في التحميل</p>'; });

            function applyFilter() {
                var cards = grid.querySelectorAll('.product-card');
                var visibleCount = 0;
                cards.forEach(function(card) {
                    var cat = card.getAttribute('data-category');
                    var brand = card.getAttribute('data-brand');
                    var show = currentFilter === 'all' ||
                        (currentFilter === 'cat:' + cat) ||
                        (currentFilter === 'brand:' + brand);
                    card.classList.toggle('hidden', !show);
                    if (show) visibleCount++;
                });
                document.getElementById('filteredCount').textContent = visibleCount + ' منتج';
            }

            function renderProducts(products) {
                var html = '';
                products.forEach(function(p) {
                    var price = p.sizes && p.sizes[0] ? p.sizes[0].price : p.price || 0;
                    var badge = '';
                    if (p.status === 'bestseller') badge = '<span class="product-status-badge badge-bestseller">الأكثر مبيعاً</span>';
                    else if (p.status === 'new') badge = '<span class="product-status-badge badge-new">جديد</span>';

                    html += '<div class="product-card" data-category="' + (p.category || '') + '" data-brand="' + (p.brand || '') + '">' +
                        '<div class="product-img-wrap">' +
                        '<img src="' + (p.image || '') + '" alt="' + p.name + '" onerror="this.style.display=\'none\'">' +
                        '<div class="product-badge-wrap">' + badge + '</div>' +
                        '</div>' +
                        '<div class="product-info">' +
                        '<div class="product-meta"><span class="product-brand">' + (p.brand || '') + '</span><span class="product-category">' + (p.category || '') + '</span></div>' +
                        '<div class="product-name">' + p.name + '</div>' +
                        '<div class="product-desc">' + (p.description || '').substring(0, 70) + '</div>' +
                        '<div class="product-footer"><span class="product-price">₪' + price + ' <span>ILS</span></span><button class="product-cart-btn">+</button></div>' +
                        '</div></div>';
                });
                grid.innerHTML = html;
                document.getElementById('filteredCount').textContent = products.length + ' منتج';
            }
        })();
    
// Dynamic Hero Slider from Firestore
var heroSlideIndex = 0;
var heroContainer = document.getElementById('heroSlider');
if (heroContainer) {
    db.collection('heroDisplay').orderBy('order', 'asc').get().then(function(snap) {
        if (snap.empty) return;
        var slides = [];
        snap.forEach(function(doc) { slides.push(doc.data()); });
        var html = slides.map(function(slide, idx) {
            var media = slide.type === 'video'
                ? '<video src="'+slide.url+'" muted playsinline'+(idx===0?' autoplay':'')+' style="width:100%;height:70vh;object-fit:cover;" onended="goHeroSlide('+ ((idx+1)%slides.length) +')"><\/video>'
                : '<img src="'+slide.url+'" alt="'+(slide.title||'')+'">';
            return '<div class="hero-slide'+(idx===0?' active':'')+'">'+media+
                '<div class="hero-slide-overlay"><div class="hero-slide-text">'+
                (slide.title ? '<h2>'+slide.title+'<\/h2>' : '')+
                (slide.subtitle ? '<p>'+slide.subtitle+'<\/p>' : '')+
                '<\/div><\/div><\/div>';
        }).join('');
        if (slides.length > 1) {
            html += '<div class="hero-dots-container">' + slides.map(function(_, idx) {
                return '<button class="'+(idx===0?'active':'')+'" onclick="goHeroSlide('+idx+')"><\/button>';
            }).join('') + '<\/div>';
        }
        heroContainer.innerHTML = html;
        setInterval(function() {
            var allSlides = heroContainer.querySelectorAll('.hero-slide');
            if (allSlides.length <= 1) return;
            var current = allSlides[heroSlideIndex];
            if (current && !current.querySelector('video')) {
                goHeroSlide((heroSlideIndex + 1) % allSlides.length);
            }
        }, 5000);
    });
}
function goHeroSlide(n) {
    var c = document.getElementById('heroSlider');
    if (!c) return;
    var allSlides = c.querySelectorAll('.hero-slide');
    var allDots = c.querySelectorAll('.hero-dots-container button');
    if (!allSlides.length) return;
    allSlides[heroSlideIndex].classList.remove('active');
    if (allDots[heroSlideIndex]) allDots[heroSlideIndex].classList.remove('active');
    heroSlideIndex = n;
    allSlides[heroSlideIndex].classList.add('active');
    if (allDots[heroSlideIndex]) allDots[heroSlideIndex].classList.add('active');
    var vid = allSlides[heroSlideIndex].querySelector('video');
    if (vid) { vid.currentTime = 0; vid.play(); }
}

</script>
</body>
</html>
