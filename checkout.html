<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enas Shop | إتمام الطلب</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .checkout-page { min-height: 100vh; padding: 100px 20px 60px; background: var(--bg); }
        .checkout-container { max-width: 900px; margin: 0 auto; }
        .checkout-title { text-align: center; font-size: 2rem; font-weight: 900; color: var(--ink, #0E3A47); margin-bottom: 30px; }
        .checkout-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 25px; }
        .checkout-card { background: white; border-radius: var(--radius); padding: 25px; box-shadow: var(--shadow); }
        .checkout-card h3 { font-size: 1.2rem; color: var(--ink, #0E3A47); margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--primary-lighter); }
        .checkout-item { display: flex; gap: 12px; padding: 12px; background: var(--bg-alt); border-radius: 12px; margin-bottom: 10px; align-items: center; }
        .checkout-item img { width: 60px; height: 60px; object-fit: contain; border-radius: 8px; background: white; padding: 4px; }
        .checkout-item.custom-package-checkout { align-items: flex-start; }
        .checkout-item-media { width: 60px; height: 60px; border-radius: 14px; background: var(--primary-lighter); color: var(--primary-dark); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .custom-package-badge { display: inline-block; margin-top: 4px; font-size: 0.85rem; color: var(--primary-dark); font-weight: 700; }
        .checkout-item-note, .checkout-item-meta-block { display: block; color: var(--text-light); font-size: 0.85rem; line-height: 1.7; margin-top: 6px; }
        .checkout-item-price.pending { color: var(--primary-dark); font-size: 0.95rem; }
        .checkout-item-info { flex: 1; }
        .checkout-item-info h4 { font-size: 0.95rem; margin-bottom: 3px; }
        .checkout-item-info .item-brand, .checkout-item-info .item-size { display: block; font-size: 0.8rem; color: var(--text-light); }
        .checkout-item-qty { display: flex; align-items: center; gap: 0; border: 2px solid var(--primary-light); border-radius: 20px; overflow: hidden; }
        .checkout-item-qty button { width: 28px; height: 28px; border: none; background: var(--primary-lighter); color: var(--primary); font-weight: 700; cursor: pointer; font-size: 1rem; transition: var(--transition); }
        .checkout-item-qty button:hover { background: var(--primary); color: white; }
        .checkout-item-qty span { min-width: 28px; text-align: center; font-weight: 700; font-size: 0.9rem; }
        .checkout-item-price { font-weight: 700; color: var(--primary); min-width: 60px; text-align: center; }
        .checkout-item-remove { background: none; border: none; color: #ef4444; font-size: 1.2rem; cursor: pointer; opacity: 0.6; transition: var(--transition); }
        .checkout-item-remove:hover { opacity: 1; }
        .summary-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #f3f4f6; font-size: 0.95rem; }
        .summary-row.total { border-bottom: none; padding-top: 15px; font-size: 1.3rem; font-weight: 900; color: var(--primary-dark); }
        .summary-row .label { color: var(--text-light); }
        .delivery-options { display: flex; flex-direction: column; gap: 10px; margin: 15px 0; }
        .delivery-option { display: flex; align-items: center; gap: 12px; padding: 15px; border: 2px solid var(--primary-light); border-radius: 12px; cursor: pointer; transition: var(--transition); }
        .delivery-option:hover { border-color: var(--primary); background: var(--primary-lighter); }
        .delivery-option.selected { border-color: var(--primary); background: var(--primary-lighter); }
        .delivery-option .radio-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--primary-light); display: flex; align-items: center; justify-content: center; transition: var(--transition); }
        .delivery-option.selected .radio-dot { border-color: var(--primary); }
        .delivery-option.selected .radio-dot::after { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
        .delivery-option-info h4 { font-size: 0.95rem; }
        .delivery-option-info p { font-size: 0.8rem; color: var(--text-light); margin-top: 2px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group textarea { width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 0.95rem; transition: var(--transition); }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(212,175,55,0.18); }
        .btn-place-order { width: 100%; padding: 15px; background: var(--ink, #0E3A47); color: #fff; border: none; border-radius: 12px; font-family: 'Tajawal', sans-serif; font-size: 1.02rem; font-weight: 800; cursor: pointer; transition: transform .25s cubic-bezier(.22,1,.36,1), background .25s; margin-top: 14px; }
        .btn-place-order:hover { background: #0a2c36; transform: translateY(-2px); }
        .btn-place-order:disabled { opacity: 0.6; cursor: wait; transform: none; }
        .pay-badge { margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: var(--primary-lighter); color: var(--ink, #0E3A47); font-weight: 700; font-size: 0.9rem; text-align: center; }
        .checkout-secure-line { display:flex; align-items:center; justify-content:center; gap:6px; margin-top:12px; color: var(--text-light); font-size: 0.8rem; }
        /* payment options */
        .pay-options { display:flex; flex-direction:column; gap:10px; margin-top:6px; }
        .pay-option { display:flex; align-items:center; gap:12px; padding:15px; border:2px solid var(--primary-light); border-radius:12px; cursor:pointer; transition: var(--transition); }
        .pay-option:hover, .pay-option.selected { border-color: var(--primary); background: var(--primary-lighter); }
        .pay-option .radio-dot { width:20px; height:20px; border-radius:50%; border:2px solid var(--primary-light); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
        .pay-option.selected .radio-dot { border-color: var(--primary); }
        .pay-option.selected .radio-dot::after { content:''; width:10px; height:10px; border-radius:50%; background: var(--primary); }
        .pay-option-info { flex:1; } .pay-option-info h4 { font-size:0.98rem; } .pay-option-info p { font-size:0.8rem; color: var(--text-light); margin-top:2px; }
        .pay-ico { font-size:1.4rem; }
        .pay-brands { display:flex; gap:6px; } .pay-brands i { font-style:normal; font-weight:800; font-size:0.7rem; padding:4px 7px; border-radius:6px; background:#fff; border:1px solid var(--primary-light); color: var(--ink,#0E3A47); }
        .card-panel { margin-top:14px; padding:16px; border-radius:12px; background: var(--bg-alt); }
        .saved-cards { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
        .saved-card-chip { display:flex; align-items:center; gap:8px; padding:9px 12px; border:2px solid var(--primary-light); background:#fff; border-radius:10px; cursor:pointer; font-family:'Tajawal',sans-serif; font-size:0.85rem; font-weight:700; transition: var(--transition); }
        .saved-card-chip.on { border-color: var(--primary); background: var(--primary-lighter); }
        .saved-card-chip .scc-brand { font-size:0.68rem; padding:3px 6px; border-radius:5px; background: var(--ink,#0E3A47); color:#fff; }
        .saved-card-chip.add { color: var(--brand-accent,#1B7A97); }
        .gateway-form { display:flex; flex-direction:column; gap:12px; opacity:0.75; }
        .gw-row { display:flex; gap:12px; } .gw-row .gw-field { flex:1; }
        .gw-field label { display:block; font-size:0.82rem; font-weight:700; margin-bottom:5px; color: var(--text-light); }
        .gw-field input { width:100%; padding:11px 14px; border:2px dashed var(--primary-light); border-radius:10px; background:#fff; font-family:'Tajawal',sans-serif; font-size:0.9rem; }
        .gateway-note { display:flex; gap:8px; margin-top:14px; padding:11px 13px; border-radius:10px; background: var(--primary-lighter); color: var(--ink,#0E3A47); font-size:0.82rem; line-height:1.7; }
        .gateway-note svg { flex-shrink:0; margin-top:3px; }
        /* saved addresses */
        .saved-addr-wrap { margin-top:14px; }
        .saved-addr-label { font-size:0.85rem; font-weight:700; color: var(--text-light); margin-bottom:8px; }
        .saved-addr-chips { display:flex; flex-wrap:wrap; gap:8px; }
        .addr-chip { display:flex; flex-direction:column; align-items:flex-start; gap:2px; padding:8px 13px; border:2px solid var(--primary-light); background:#fff; border-radius:10px; cursor:pointer; font-family:'Tajawal',sans-serif; text-align:right; transition: var(--transition); }
        .addr-chip.on { border-color: var(--primary); background: var(--primary-lighter); }
        .addr-chip b { font-size:0.85rem; } .addr-chip span { font-size:0.75rem; color: var(--text-light); }
        /* order success */
        .order-success { background:#fff; border-radius:18px; padding:40px 28px; box-shadow: var(--shadow); text-align:center; max-width:560px; margin:0 auto; animation: osIn .5s cubic-bezier(.22,1,.36,1) both; }
        @keyframes osIn { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform:none; } }
        .os-check { width:74px; height:74px; margin:0 auto 18px; border-radius:50%; background: var(--primary-lighter); color: var(--brand-accent,#1B7A97); display:flex; align-items:center; justify-content:center; animation: osPop .5s cubic-bezier(.22,1,.36,1) .1s both; }
        @keyframes osPop { from { transform: scale(.6); opacity:0; } to { transform: scale(1); opacity:1; } }
        .order-success h2 { font-size:1.5rem; color: var(--ink,#0E3A47); margin-bottom:8px; }
        .os-sub { color: var(--text-light); margin-bottom:22px; }
        .os-idcard { border:2px dashed var(--primary-light); border-radius:14px; padding:16px; margin-bottom:20px; background: var(--bg-alt); }
        .os-id-label { display:block; font-size:0.8rem; color: var(--text-light); margin-bottom:8px; }
        .os-id-row { display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap; }
        .os-id-row code { font-family:'Courier New',monospace; font-size:1.25rem; font-weight:800; letter-spacing:1px; color: var(--ink,#0E3A47); direction:ltr; }
        .os-copy { display:inline-flex; align-items:center; gap:6px; padding:9px 14px; border:none; border-radius:10px; background: var(--ink,#0E3A47); color:#fff; font-family:'Tajawal',sans-serif; font-weight:700; font-size:0.85rem; cursor:pointer; transition: background .25s, transform .2s; }
        .os-copy:hover { transform: translateY(-1px); }
        .os-copy.copied { background: var(--brand-accent,#1B7A97); }
        .os-summary { text-align:right; border-top:1px solid var(--primary-lighter); padding-top:16px; margin-bottom:22px; }
        .os-line { display:flex; justify-content:space-between; gap:12px; padding:8px 0; font-size:0.92rem; border-bottom:1px solid #f1f5f8; }
        .os-line:last-child { border-bottom:none; } .os-line span { color: var(--text-light); } .os-line b { color: var(--ink,#0E3A47); text-align:left; }
        .os-actions { display:flex; gap:12px; flex-wrap:wrap; }
        .os-actions button { flex:1; min-width:150px; padding:14px; border-radius:12px; font-family:'Tajawal',sans-serif; font-weight:800; font-size:0.95rem; cursor:pointer; transition: transform .2s, background .25s; }
        .os-btn-primary { border:none; background: var(--ink,#0E3A47); color:#fff; } .os-btn-primary:hover { background:#0a2c36; transform: translateY(-2px); }
        .os-btn-ghost { border:2px solid var(--primary); background:#fff; color: var(--ink,#0E3A47); } .os-btn-ghost:hover { background: var(--primary-lighter); transform: translateY(-2px); }
        @media (prefers-reduced-motion: reduce) { .order-success, .os-check, .btn-place-order, .os-actions button, .os-copy { animation:none !important; transition:none !important; } }
        .back-link { display: inline-block; margin-bottom: 20px; color: var(--primary); text-decoration: none; font-weight: 600; }
        .back-link:hover { text-decoration: underline; }
        .empty-checkout { text-align: center; padding: 60px; background: white; border-radius: var(--radius); box-shadow: var(--shadow); }
        .empty-checkout span { font-size: 3rem; display: block; margin-bottom: 15px; color: var(--primary); }
        .empty-checkout p { color: var(--text-light); margin-bottom: 20px; }
        .empty-checkout a { display: inline-block; padding: 12px 30px; background: var(--primary); color: white; text-decoration: none; border-radius: 25px; font-weight: 700; }
        .region-options { display: flex; gap: 10px; flex-wrap: wrap; }
        .region-option { flex: 1; min-width: 80px; padding: 12px 16px; border: 2px solid var(--primary-light); border-radius: 12px; cursor: pointer; text-align: center; transition: var(--transition); display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .region-option:hover { border-color: var(--primary); background: var(--primary-lighter); }
        .region-option.selected { border-color: var(--primary); background: var(--primary-lighter); }
        .region-option span:first-child { font-weight: 700; font-size: 0.95rem; }
        .region-cost { font-size: 0.85rem; color: var(--primary); font-weight: 600; }
        .checkout-status { text-align: center; margin-bottom: 18px; color: var(--text-light); font-weight: 600; }
        .checkout-status.error { color: #b91c1c; }
        @media (max-width: 768px) { .checkout-grid { grid-template-columns: 1fr; } .checkout-page { padding: 80px 15px 40px; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container" style="justify-content: space-between;">
            <a href="index.html" class="logo"><img src="logo.png" alt="Enas Shop" class="logo-img"><span class="logo-text" style="font-size:1rem;">Enas Shop</span></a>
            <a href="index.html" style="color: var(--primary-dark); text-decoration: none; font-weight: 600; font-size: 0.95rem; white-space: nowrap; padding: 8px 20px; margin-left: 10px;">← الرئيسية</a>
        </div>
    </nav>

    <div class="checkout-page">
        <div class="checkout-container">
            <a href="index.html" class="back-link">→ العودة للتسوق</a>
            <h1 class="checkout-title">إتمام الطلب</h1>
            <p class="checkout-status" id="checkoutStatus">جاري تحميل بيانات الطلب...</p>
            <div id="checkoutContent"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="data.js"></script>
    <script src="shared.js"></script>
    <script>
        var FALLBACK_IMAGE = "data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%23fdf8e8%22/%3E%3Ctext x=%2250%22 y=%2257%22 text-anchor=%22middle%22 font-size=%2218%22 fill=%22%23d4af37%22%3EIMG%3C/text%3E%3C/svg%3E";
        var products = normalizeProducts(DEFAULT_PRODUCTS);
        var discounts = normalizeDiscounts(DEFAULT_DISCOUNTS);
        var siteSettings = normalizeSettings(DEFAULT_SITE_SETTINGS);
        var cart = normalizeCartItems(JSON.parse(localStorage.getItem('drenasshop_cart') || '[]'), products);
        var selectedDelivery = localStorage.getItem('drenasshop_delivery_method') || 'delivery';
        var selectedRegion = '';
        var comboOffers = [];
        var comboSelectedIds = [];
        var currentComboOffer = null;

        // Loyalty redemption state
        var loyaltyCfg = null;
        var currentCust = null;
        var useLoyaltyRedeem = false;

        // Payment state (bank gateway prepared; COD is the only live method for now)
        var selectedPayment = localStorage.getItem('drenasshop_payment_method') || 'cod';
        var selectedCardId = null;
        var selectedAddressId = null;

        var DELIVERY_COSTS = { westbank: 20, jerusalem: 30, inside: 50 };
        var DELIVERY_LABELS = { westbank: 'الضفة', jerusalem: 'القدس', inside: 'الداخل' };

        document.addEventListener('DOMContentLoaded', initializeCheckout);

        function initializeCheckout() {
            cart = normalizeCartItems(JSON.parse(localStorage.getItem('drenasshop_cart') || '[]'), products);
            saveCart();
            render();
            setStatus('');

            // Loyalty: load logged-in customer + program config, then re-render summary
            if (window.getCurrentCustomer) currentCust = window.getCurrentCustomer();
            if (window.shGetLoyaltyConfig) {
                window.shGetLoyaltyConfig().then(function (cfg) {
                    loyaltyCfg = cfg;
                    if (window.shRefreshCustomer && currentCust) {
                        window.shRefreshCustomer(currentCust.id).then(function (fresh) {
                            if (fresh) currentCust = fresh;
                            render();
                        }).catch(function () { render(); });
                    } else {
                        render();
                    }
                }).catch(function () {});
            }

            if (window.db) {
                var fetchDone = false;
                var timeout = setTimeout(function () {
                    if (!fetchDone) console.log('Firestore fetch timed out, using local data');
                }, 5000);

                Promise.all([
                    db.collection('products').get(),
                    db.collection('discounts').get(),
                    db.collection('settings').doc('config').get(),
                    db.collection('offers').get()
                ]).then(function (responses) {
                    var productsSnap = responses[0];
                    var discountsSnap = responses[1];
                    var settingsSnap = responses[2];
                    var offersSnap = responses[3];
                    fetchDone = true;
                    clearTimeout(timeout);

                    if (!productsSnap.empty) {
                        products = productsSnap.docs.map(function (docSnap) { var d = docSnap.data(); d.id = docSnap.id; return normalizeProduct(d); });
                    }
                    discounts = discountsSnap.docs.map(function (docSnap) { return normalizeDiscount(docSnap.data()); });
                    siteSettings = normalizeSettings(settingsSnap.exists ? settingsSnap.data() : DEFAULT_SITE_SETTINGS);
                    if (offersSnap && !offersSnap.empty) {
                        offersSnap.forEach(function(doc) { var d = doc.data(); d.id = doc.id; if (d.active && d.type === 'combo') comboOffers.push(d); });
                    }
                    cart = normalizeCartItems(JSON.parse(localStorage.getItem('drenasshop_cart') || '[]'), products);
                    saveCart();
                    render();
                }).catch(function (error) {
                    console.error('Firestore fetch error:', error);
                });
            }
        }

        function setStatus(message, type) {
            var status = document.getElementById('checkoutStatus');
            if (!status) return;
            status.textContent = message;
            status.className = 'checkout-status' + (type ? ' ' + type : '');
            status.style.display = message ? 'block' : 'none';
        }

        function getCheckoutItemsCount() {
            return cart.reduce(function (sum, item) {
                return sum + Math.max(1, parseInt(item.qty, 10) || 1);
            }, 0);
        }

        function renderCustomCheckoutItem(item) {
            var details = getCustomPackageSetsHtml(item.sets);
            var meta = '<span class="checkout-item-meta-block">لون التغليف: ' + getWrapperColorLabel(item.wrapperColor) + '</span>';
            meta += '<span class="checkout-item-meta-block">طريقة الاستلام: ' + (item.delivery === 'pickup' ? 'استلام من المصنع' : 'توصيل') + '</span>';
            meta += '<span class="checkout-item-meta-block">الاسم: ' + escapeHtml(item.customerName) + ' • الهاتف: ' + escapeHtml(item.customerPhone) + '</span>';
            if (item.delivery === 'delivery' && item.customerLocation) meta += '<span class="checkout-item-meta-block">الموقع: ' + escapeHtml(item.customerLocation) + '</span>';
            if (item.notes) meta += '<span class="checkout-item-note">ملاحظات: ' + escapeHtml(item.notes) + '</span>';
            return '<div class="checkout-item custom-package-checkout"><div class="checkout-item-media">🎁</div><div class="checkout-item-info"><h4>' + getCustomPackageTitle(item) + '</h4><span class="custom-package-badge">سعر يحدد بعد المراجعة</span><div class="custom-package-sets">' + details + '</div>' + meta + '</div><div class="checkout-item-price pending">يحدد لاحقاً</div><button class="checkout-item-remove" onclick="removeItem(\'' + item.id + '\', -1)">✕</button></div>';
        }

        function render() {
            var container = document.getElementById('checkoutContent');
            if (cart.length === 0) {
                container.innerHTML = '<div class="empty-checkout"><span>•</span><p>السلة فارغة! أضيفي منتجات أولاً</p><a href="index.html">تسوقي الآن</a></div>';
                return;
            }

            var itemsHTML = '';
            // Group combo items, package items, and regular items
            var comboGroups = {};
            var packageItems = [];
            var regularItems = [];
            cart.forEach(function(item) {
                if (item.type === 'custom_package') { regularItems.push(item); return; }
                if (item.comboOfferId) {
                    if (!comboGroups[item.comboOfferId]) comboGroups[item.comboOfferId] = { title: item.comboTitle || 'عرض خاص', items: [], offerId: item.comboOfferId };
                    comboGroups[item.comboOfferId].items.push(item);
                } else if (item.type === 'package') {
                    packageItems.push(item);
                } else {
                    regularItems.push(item);
                }
            });
            // Render combo groups
            Object.keys(comboGroups).forEach(function(offerId) {
                var group = comboGroups[offerId];
                var totalPrice = group.items.reduce(function(s, i) { return s + i.price; }, 0);
                itemsHTML += '<div class="cart-combo-group"><div class="cart-combo-header"><span>🎁 ' + group.title + ' - ₪' + Math.round(totalPrice) + '</span><button class="cart-combo-edit" onclick="editCheckoutCombo(\'' + offerId + '\')">تعديل</button></div>';
                group.items.forEach(function(item) {
                    var p = products.find(function(pr) { return String(pr.id) === String(item.productId); });
                    if (p) itemsHTML += '<div class="checkout-item combo-checkout-item"><img src="' + p.image + '" alt="' + p.name + '" onerror="this.style.display=\'none\'"><div class="checkout-item-info"><h4>' + p.name + '</h4></div><div class="checkout-item-price">₪' + Math.round(item.price) + '</div></div>';
                });
                itemsHTML += '</div>';
            });
            // Render package items
            packageItems.forEach(function(item) {
                var productNames = (item.packageProducts || []).map(function(pid) {
                    var p = products.find(function(pr) { return String(pr.id) === String(pid); });
                    return p ? p.name : '';
                }).filter(Boolean).join('، ');
                var productImages = (item.packageProducts || []).slice(0, 4).map(function(pid) {
                    var p = products.find(function(pr) { return String(pr.id) === String(pid); });
                    return p ? '<img src="' + p.image + '" style="width:36px;height:36px;object-fit:cover;border-radius:6px;" onerror="this.style.display=\'none\'">' : '';
                }).join('');

                html += '<div class="region-option ' + (selectedRegion === 'jerusalem' ? 'selected' : '') + '" onclick="selectRegion(\'jerusalem\')"><span>القدس</span><span class="region-cost">₪30</span></div>';

            html += '<div class="form-group" id="addressGroup" style="' + (selectedDelivery === 'pickup' ? 'display:none' : '') + '"><label>العنوان (المدينة + تفاصيل)</label><textarea id="custAddress" rows="2" placeholder="المدينة، الحي، الشارع..."></textarea></div>';

                var rv = formatCurrency(rp * (loyaltyCfg.redeemValue || 0.1));

                    html += '<div class="summary-row discount"><span class="label">خصم النقاط:</span><span>− ' + formatCurrency(loyaltyDiscount()) + '</span></div>';

            html += '<p class="checkout-secure-line"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> معاملة آمنة ومحمية</p>';

        function savedAddressChips() {
            if (!currentCust || !Array.isArray(currentCust.addresses) || !currentCust.addresses.length) return '';
            var REG = { westbank: 'الضفة', jerusalem: 'القدس', inside: 'الداخل' };
            var chips = currentCust.addresses.map(function (a) {
                var on = selectedAddressId === a.id;
                return '<button type="button" class="addr-chip' + (on ? ' on' : '') + '" onclick="pickAddress(\'' + a.id + '\')">' +
                    '<b>' + escapeHtml(a.label) + '</b><span>' + escapeHtml(REG[a.region] || '') + (a.city ? ' • ' + escapeHtml(a.city) : '') + '</span></button>';
            }).join('');
            return '<div class="saved-addr-wrap"><div class="saved-addr-label">عناوينك المحفوظة</div><div class="saved-addr-chips">' + chips + '</div></div>';
        }

        window.pickAddress = function (id) {
            var a = (currentCust.addresses || []).filter(function (x) { return x.id === id; })[0];
            if (!a) return;
            selectedAddressId = id;
            var formData = getFormValues();
            selectedRegion = a.region || selectedRegion;
            render();
            formData.address = (a.city ? a.city + '، ' : '') + a.details;
            if (a.phone) formData.phone = formData.phone || a.phone;
            restoreFormValues(formData);
        };

        function renderPaymentSection() {
            var s = '';
            s += '<div class="checkout-card" style="margin-top:20px;">';
            s += '<h3>طريقة الدفع</h3>';
            s += '<div class="pay-options">';
            s += '<div class="pay-option ' + (selectedPayment === 'cod' ? 'selected' : '') + '" onclick="selectPayment(\'cod\')">' +
                '<div class="radio-dot"></div><div class="pay-option-info"><h4>الدفع عند الاستلام</h4><p>ادفعي نقداً عند وصول طلبك</p></div>' +
                '<span class="pay-ico">💵</span></div>';
            s += '<div class="pay-option ' + (selectedPayment === 'card' ? 'selected' : '') + '" onclick="selectPayment(\'card\')">' +
                '<div class="radio-dot"></div><div class="pay-option-info"><h4>بطاقة / دفع إلكتروني</h4><p>عبر بوابة البنك الآمنة</p></div>' +
                '<span class="pay-brands"><i>VISA</i><i>MC</i></span></div>';
            s += '</div>';
            if (selectedPayment === 'card') s += renderCardPanel();
            s += '</div>';
            return s;
        }

        function renderCardPanel() {
            var p = '<div class="card-panel">';
            // Saved cards for logged-in customers
            if (currentCust && Array.isArray(currentCust.cards) && currentCust.cards.length) {
                p += '<div class="saved-cards">';
                currentCust.cards.forEach(function (cd) {
                    var on = selectedCardId === cd.id || (!selectedCardId && cd.isDefault);
                    p += '<button type="button" class="saved-card-chip' + (on ? ' on' : '') + '" onclick="pickCard(\'' + cd.id + '\')">' +
                        '<span class="scc-brand">' + escapeHtml(cd.brand === 'visa' ? 'Visa' : cd.brand === 'mastercard' ? 'MC' : 'بطاقة') + '</span>' +
                        '<span class="scc-num">•••• ' + escapeHtml(cd.last4) + '</span></button>';
                });
                p += '<button type="button" class="saved-card-chip add' + (selectedCardId === 'new' ? ' on' : '') + '" onclick="pickCard(\'new\')">+ بطاقة جديدة</button>';
                p += '</div>';
            }
            var showForm = !(currentCust && currentCust.cards && currentCust.cards.length) || selectedCardId === 'new';
            if (showForm) {
                p += '<div class="gateway-form" aria-disabled="true">' +
                    '<div class="gw-field"><label>رقم البطاقة</label><input type="tel" inputmode="numeric" placeholder="0000 0000 0000 0000" disabled></div>' +
                    '<div class="gw-row"><div class="gw-field"><label>تاريخ الانتهاء</label><input type="text" placeholder="MM/YY" disabled></div>' +
                    '<div class="gw-field"><label>CVV</label><input type="text" placeholder="•••" disabled></div></div>' +
                    '</div>';
            }
            p += '<div class="gateway-note"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' +
                '<span>بوابة الدفع الإلكتروني قيد التفعيل. سيتم تحويلك لصفحة البنك الآمنة لإتمام الدفع عند الربط — حالياً يُسجَّل طلبك ونتواصل معك لإتمام الدفع.</span></div>';
            p += '</div>';
            return p;
        }

        window.selectPayment = function (method) {
            var formData = getFormValues();
            selectedPayment = method;
            localStorage.setItem('drenasshop_payment_method', method);
            render();
            restoreFormValues(formData);
        };
        window.pickCard = function (id) {
            var formData = getFormValues();
            selectedCardId = id;
            render();
            restoreFormValues(formData);
        };
        function payMethodSummary() {
            if (selectedPayment === 'card') return '💳 دفع إلكتروني عبر بوابة البنك';
            return '💵 الدفع عند الاستلام';
        }

        function getSubtotal() {
            return cart.reduce(function (sum, item) {
                if (item.type === 'custom_package') return sum;
                if (item.comboOfferId) return sum + (item.price * item.qty);
                if (item.type === 'package') return sum + (item.price * item.qty);
                var product = products.find(function (entry) { return String(entry.id) === String(item.id); });
                return product ? sum + getFinalPrice(product, item.sizeIdx, discounts).final * item.qty : sum;
            }, 0);
        }

        function changeQty(productId, sizeIdx, delta) {
            var item = cart.find(function (entry) { return entry.id === productId && entry.sizeIdx === sizeIdx; });
            if (!item || item.type === 'custom_package') return;
            item.qty += delta;
            if (item.qty < 1) return removeItem(productId, sizeIdx);
            saveCart();
            render();
        }

        function removeItem(productId, sizeIdx) {
            cart = cart.filter(function (entry) {
                if (entry.type === 'custom_package') return entry.id !== String(productId);
                return !(entry.id === productId && entry.sizeIdx === sizeIdx);
            });
            saveCart();
            render();
        }

        function saveCart() {
            localStorage.setItem('drenasshop_cart', JSON.stringify(normalizeCartItems(cart, products)));
        }

        function selectDelivery(method) {
            var formData = getFormValues();
            selectedDelivery = method;
            if (method === 'pickup') selectedRegion = '';
            localStorage.setItem('drenasshop_delivery_method', method);
            render();
            restoreFormValues(formData);
        }

        function selectRegion(region) {
            var formData = getFormValues();
            selectedRegion = region;
            render();
            restoreFormValues(formData);
        }

        function getFormValues() {
            return {
                name: (document.getElementById('custName') || {}).value || '',
                phone: (document.getElementById('custPhone') || {}).value || '',
                address: (document.getElementById('custAddress') || {}).value || '',
                notes: (document.getElementById('custNotes') || {}).value || ''
            };
        }

        function restoreFormValues(data) {
            var name = document.getElementById('custName');
            var phone = document.getElementById('custPhone');
            var address = document.getElementById('custAddress');
            var notes = document.getElementById('custNotes');
            if (name) name.value = data.name || (currentCust && currentCust.name) || '';
            if (phone) phone.value = data.phone || (currentCust && currentCust.phone) || '';
            if (address) address.value = data.address || '';
            if (notes) notes.value = data.notes || '';
        }

        function getDeliveryCost() {
            if (selectedDelivery === 'pickup') return 0;
            var baseCost = DELIVERY_COSTS[selectedRegion] || 0;
            // Check for free delivery discount
            var subtotal = getSubtotal();
            for (var i = 0; i < discounts.length; i++) {
                var d = discounts[i];
                if (d.type === 'free_delivery' && subtotal >= (d.minAmount || 0)) {
                    var now = new Date().toISOString().slice(0, 10);
                    if (!d.expiresAt || d.expiresAt >= now) return 0;
                }
            }
            return baseCost;
        }

        function getDeliveryCostLabel() {
            if (selectedDelivery === 'pickup') return 'مجاني (استلام ذاتي)';
            if (!selectedRegion) return 'اختاري المنطقة';
            var cost = getDeliveryCost();
            if (cost === 0 && selectedDelivery !== 'pickup') return 'مجاني 🎉 (توصيل مجاني)';
            return formatCurrency(cost) + ' (' + DELIVERY_LABELS[selectedRegion] + ')';
        }

        function getTotal() {
            return getSubtotal() + getDeliveryCost();
        }

        // ---- Loyalty redemption helpers ----
        function loyaltyActive() {
            return !!(currentCust && loyaltyCfg && loyaltyCfg.enabled &&
                (currentCust.points || 0) >= (loyaltyCfg.minRedeem || 0) &&
                !hasCustomPricingPending(cart));
        }
        // Max points redeemable on this order (respects balance, minRedeem, maxRedeemPercent)
        function maxRedeemablePoints() {
            if (!loyaltyActive()) return 0;
            var goods = getSubtotal();
            if (goods <= 0) return 0;
            var val = loyaltyCfg.redeemValue || 0.1;
            var cap = Math.floor((goods * (loyaltyCfg.maxRedeemPercent || 30) / 100) / val);
            var pts = Math.min(currentCust.points || 0, cap);
            if (pts < (loyaltyCfg.minRedeem || 0)) return 0;
            return pts;
        }
        function loyaltyDiscount() {
            if (!useLoyaltyRedeem) return 0;
            return maxRedeemablePoints() * (loyaltyCfg.redeemValue || 0.1);
        }
        function getPayableTotal() {
            return Math.max(0, getTotal() - loyaltyDiscount());
        }
        function toggleLoyaltyRedeem() {
            useLoyaltyRedeem = !useLoyaltyRedeem;
            render();
        }

        function buildOrder() {
            var customerName = document.getElementById('custName').value.trim();
            var customerPhone = document.getElementById('custPhone').value.trim();
            var address = document.getElementById('custAddress') ? document.getElementById('custAddress').value.trim() : '';
            var notes = document.getElementById('custNotes').value.trim();
            var subtotal = getSubtotal();
            var deliveryCost = getDeliveryCost();
            var total = subtotal + deliveryCost;
            var pricingPending = hasCustomPricingPending(cart);
            var id = makeOrderId();
            var redeemPts = (useLoyaltyRedeem && loyaltyActive()) ? maxRedeemablePoints() : 0;
            var pointsDiscount = redeemPts * ((loyaltyCfg && loyaltyCfg.redeemValue) || 0.1);
            var payable = Math.max(0, total - pointsDiscount);
            return {
                id: id,
                items: cart.map(function (item) {
                    if (item.type === 'custom_package') {
                        return {
                            type: 'custom_package',
                            packageId: item.id,
                            name: getCustomPackageTitle(item),
                            qty: 1,
                            wrapperColor: item.wrapperColor,
                            notes: item.notes,
                            delivery: item.delivery,
                            customerName: item.customerName,
                            customerPhone: item.customerPhone,
                            customerLocation: item.customerLocation,
                            sets: item.sets,
                            pricePending: true,
                            lineTotal: null
                        };
                    }
                    if (item.comboOfferId) {
                        var comboProduct = products.find(function(p) { return String(p.id) === String(item.productId); });
                        return {
                            type: 'combo',
                            productId: item.productId,
                            name: comboProduct ? comboProduct.name : 'منتج عرض',
                            comboOfferId: item.comboOfferId,
                            comboTitle: item.comboTitle,
                            qty: item.qty,
                            price: item.price,
                            lineTotal: item.price * item.qty
                        };
                    }
                    if (item.type === 'package') {
                        return {
                            type: 'package',
                            packageId: item.id,
                            name: item.packageName || 'باقة',
                            packageProducts: item.packageProducts,
                            qty: item.qty,
                            price: item.price,
                            lineTotal: item.price * item.qty
                        };
                    }
                    var product = products.find(function (entry) { return String(entry.id) === String(item.id); });
                    if (!product) return { productId: item.id, name: 'منتج', qty: item.qty, price: item.price, lineTotal: item.price * item.qty };
                    var sizeData = getSizeData(product, item.sizeIdx);
                    var pricing = getFinalPrice(product, item.sizeIdx, discounts);
                    return {
                        productId: product.id,
                        name: product.name,
                        brand: product.brand,
                        sizeIdx: item.sizeIdx,
                        sizeLabel: getSizeLabel(sizeData),
                        qty: item.qty,
                        price: pricing.final,
                        lineTotal: pricing.final * item.qty
                    };
                }),
                customerName: customerName,
                customerPhone: customerPhone,
                address: address,
                notes: notes,
                delivery: selectedDelivery,
                region: selectedDelivery === 'delivery' ? selectedRegion : 'pickup',
                deliveryCost: deliveryCost,
                subtotal: subtotal,
                total: payable,
                grossTotal: total,
                customerId: (currentCust && currentCust.id) || null,
                pointsRedeemed: redeemPts,
                pointsDiscount: pointsDiscount,
                totalDisplay: getTotalDisplayText(payable, pricingPending),
                pricingPending: pricingPending,
                paymentMethod: selectedPayment,
                paymentStatus: selectedPayment === 'card' ? 'awaiting_gateway' : 'cod_pending',
                paymentCardLast4: (selectedPayment === 'card' && selectedCardId && selectedCardId !== 'new' && currentCust && currentCust.cards)
                    ? (currentCust.cards.filter(function (x) { return x.id === selectedCardId; })[0] || {}).last4 || null
                    : null,
                date: new Date().toISOString(),
                status: 'new'
            };
        }

            html += '<h2>تم استلام طلبك بنجاح</h2>';

                '<span>نسخ</span></button></div></div>';
            html += '<div class="os-summary">';

            html += '<div class="os-line"><span>الإجمالي</span><b>' + (order.totalDisplay || formatCurrency(order.total)) + '</b></div>';
            html += '<div class="os-line"><span>طريقة الدفع</span><b>' + payLabel + '</b></div>';
            html += '<div class="os-line"><span>الاستلام</span><b>' + deliveryLabel + '</b></div>';
            html += '</div>';
            html += '<div class="os-actions">';
            html += '<button type="button" class="os-btn-primary" onclick="window.location.href=\'index.html\'">متابعة التسوّق</button>';
            html += '<button type="button" class="os-btn-ghost" onclick="window.location.href=\'confirmation.html\'">تفاصيل الطلب</button>';
            html += '</div></div>';
            container.innerHTML = html;
            setStatus('تم حفظ الطلب بنجاح. رقم الطلب: ' + order.id, 'success');
        }

        window.copyOrderId = function (id) {
            var btn = document.getElementById('copyOrderIdBtn');
            function done() {
                if (!btn) return;
                btn.classList.add('copied');
                var span = btn.querySelector('span'); if (span) span.textContent = 'تم النسخ ✓';
                setTimeout(function () { btn.classList.remove('copied'); if (span) span.textContent = 'نسخ'; }, 1800);
            }
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(id).then(done).catch(fallbackCopy);
            } else { fallbackCopy(); }
            function fallbackCopy() {
                try {
                    var t = document.createElement('textarea');
                    t.value = id; t.style.position = 'fixed'; t.style.opacity = '0';
                    document.body.appendChild(t); t.select(); document.execCommand('copy');
                    document.body.removeChild(t); done();
                } catch (e) { if (window.showToast) window.showToast('تعذر النسخ', 'error'); }
            }
        };

        function confirmOrder() {
            var customerName = document.getElementById('custName').value.trim();
            var customerPhone = document.getElementById('custPhone').value.trim();
            if (!customerName || !customerPhone) return alert('الرجاء إدخال الاسم ورقم الهاتف');
            if (customerPhone.length < 9 || customerPhone.length > 14) return alert('رقم الهاتف غير صحيح');
            if (selectedDelivery === 'delivery') {
                if (!selectedRegion) return alert('الرجاء اختيار المنطقة');
                var address = document.getElementById('custAddress').value.trim();
                if (!address) return alert('الرجاء إدخال عنوان التوصيل');
            }

            var button = document.getElementById('confirmOrderBtn');
            var originalText = button.textContent;
            button.disabled = true;
            button.textContent = 'جاري حفظ الطلب...';
            setStatus('جاري حفظ الطلب...', '');

            var order = buildOrder();
            if (!window.db) {
                alert('تعذر الاتصال بقاعدة البيانات حالياً، حاولي مرة أخرى.');
                button.disabled = false;
                button.textContent = originalText;
                setStatus('');
                return;
            }

            db.collection('orders').doc(order.id).set(order).then(function () {
                localStorage.setItem('drenasshop_last_order', JSON.stringify(order));
                localStorage.setItem('drenasshop_cart', '[]');
                cart = [];
                if (order.pointsRedeemed > 0 && order.customerId && window.shApplyPoints) {
                    window.shApplyPoints(order.customerId, -order.pointsRedeemed, 'redeem', { orderId: order.id })
                        .then(function () { if (window.shRefreshCustomer) window.shRefreshCustomer(order.customerId); })
                        .catch(function (e) { console.error('redeem failed', e); });
                }
                showOrderSuccess(order);
            }).catch(function (error) {
                console.error(error);
                alert('تعذر حفظ الطلب حالياً، حاولي مرة أخرى.');
                button.disabled = false;
                button.textContent = originalText;
                setStatus('');
            });
        }
        // Combo edit in checkout
        function editCheckoutCombo(offerId) {
            currentComboOffer = comboOffers.find(function(o) { return o.id === offerId; });
            if (!currentComboOffer) return;
            var comboItems = cart.filter(function(item) { return item.comboOfferId === offerId; });
            comboSelectedIds = comboItems.map(function(item) { return item.productId; });
            openCheckoutComboModal();
        }

        function openCheckoutComboModal() {
            if (!currentComboOffer) return;
            var modal = document.getElementById('checkoutComboModal');
            if (!modal) return;
            document.getElementById('cComboTitle').textContent = currentComboOffer.title || 'عرض خاص';
            document.getElementById('cComboTotal').textContent = currentComboOffer.pickCount || 4;
            document.getElementById('cComboPrice').textContent = '₪' + (currentComboOffer.comboPrice || 0);
            renderCheckoutComboProducts();
            updateCheckoutComboProgress();
            modal.style.display = 'flex';
        }

        function closeCheckoutComboModal() {
            var modal = document.getElementById('checkoutComboModal');
            if (modal) modal.style.display = 'none';
        }

        function renderCheckoutComboProducts() {
            var grid = document.getElementById('cComboGrid');
            if (!grid || !currentComboOffer) return;
            var eligible = currentComboOffer.eligibleProducts || [];
            var pickCount = currentComboOffer.pickCount || 4;
            grid.innerHTML = eligible.map(function(pid) {
                var product = products.find(function(p) { return p.id === pid; });
                if (!product) return '';
                var isSelected = comboSelectedIds.indexOf(pid) !== -1;
                var isDisabled = !isSelected && comboSelectedIds.length >= pickCount;
                return '<div class="combo-product-card' + (isSelected ? ' selected' : '') + (isDisabled ? ' disabled' : '') + '" onclick="toggleCheckoutCombo(\'' + pid + '\')">' +
                    '<div class="combo-card-check">✓</div>' +
                    '<img src="' + product.image + '" onerror="this.src=\'' + FALLBACK_IMAGE + '\'">' +
                    '<div class="combo-card-info"><h4>' + product.name + '</h4></div></div>';
            }).join('');
        }

        function toggleCheckoutCombo(pid) {
            if (!currentComboOffer) return;
            var pickCount = currentComboOffer.pickCount || 4;
            var idx = comboSelectedIds.indexOf(pid);
            if (idx !== -1) comboSelectedIds.splice(idx, 1);
            else if (comboSelectedIds.length < pickCount) comboSelectedIds.push(pid);
            renderCheckoutComboProducts();
            updateCheckoutComboProgress();
        }

        function updateCheckoutComboProgress() {
            var countEl = document.getElementById('cComboCount');
            var btn = document.getElementById('cComboConfirmBtn');
            var pickCount = currentComboOffer ? (currentComboOffer.pickCount || 4) : 4;
            if (countEl) countEl.textContent = comboSelectedIds.length;
            if (btn) btn.disabled = comboSelectedIds.length !== pickCount;
        }

        function confirmCheckoutCombo() {
            if (!currentComboOffer || comboSelectedIds.length !== (currentComboOffer.pickCount || 4)) return;
            var unitPrice = (currentComboOffer.comboPrice || 0) / (currentComboOffer.pickCount || 1);
            cart = cart.filter(function(item) { return !item.comboOfferId || item.comboOfferId !== currentComboOffer.id; });
            comboSelectedIds.forEach(function(pid) {
                cart.push({ id: pid + '__combo__' + currentComboOffer.id, productId: pid, sizeIdx: 0, qty: 1, price: Math.round(unitPrice * 100) / 100, comboOfferId: currentComboOffer.id, comboTitle: currentComboOffer.title });
            });
            saveCart();
            closeCheckoutComboModal();
            render();
        }
    </script>

    <!-- Checkout Combo Edit Modal -->
    <div class="modal-overlay combo-overlay" id="checkoutComboModal" style="display:none;" onclick="closeCheckoutComboModal()">
        <div class="combo-modal" onclick="event.stopPropagation()">
            <button class="pdp-close" onclick="closeCheckoutComboModal()">✕</button>
            <div class="combo-modal-header">
                <span class="combo-icon">🎁</span>
                <h2 id="cComboTitle">تعديل العرض</h2>
                <div class="combo-progress"><span id="cComboCount">0</span> / <span id="cComboTotal">4</span> مختارة <span class="combo-price" id="cComboPrice"></span></div>
            </div>
            <div class="combo-products-grid" id="cComboGrid"></div>
            <div class="combo-modal-footer">
                <button class="btn-primary combo-confirm-btn" id="cComboConfirmBtn" onclick="confirmCheckoutCombo()" disabled>تأكيد التعديل</button>
            </div>
        </div>
    </div>
</body>
</html>
